# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"
# {prepend == before the default, append == after the default}

# Key notation
# You can specify one or more keys in the on of each keybinding rule,
# and each key can be represented with the following notations:
#
# Notation	Description	Notation	Description
# a - z	Lowercase letters	A - Z	Uppercase letters
# <Space>	Space key	<Backspace>	Backspace key
# <Enter>	Enter key	-	-
# <Left>	Left arrow key	<Right>	Right arrow key
# <Up>	Up arrow key	<Down>	Down arrow key
# <Home>	Home key	<End>	End key
# <PageUp>	PageUp key	<PageDown>	PageDown key
# <Tab>	Tab key	<BackTab>	Shift + Tab key
# <Delete>	Delete key	<Insert>	Insert key
# <F1> - <F19>	Function keys	<Esc>	Escape key
# You can combine the following modifiers for the keys above:
#
# Modifier	Description
# <S-…>	Shift key.
# <C-…>	Ctrl key.
# <A-…>	Alt/Meta key.
# <D-…>	Command/Windows/Super key.
# For example:
#
# <C-a> for Ctrl + a.
# <C-S-b> or <C-B> for Ctrl + Shift + b.
# Note that:
#
# Not all terminals support <D-...> - make sure your terminal supports and 
# has CSI u enabled if you want to use it.
# macOS doesn't have an Alt key, so <A-...> won't work. Some terminals offer
# a setting to map the Option as the Alt key, make sure you have it enabled.
# The legacy terminal keyboard protocol treats <Tab> and <C-i>, <Enter> and
# <C-m>, etc. as the same key. If you want to distinguish between them,
# make sure your terminal supports and has CSI u enabled.

[mgr]
prepend_keymap = [

  # keyjump keymaps
  { on = [
    "<Space>",
    "k",
  ], run = "plugin keyjump --sync --args=keep", desc = "Keyjump (Keep mode)" },
  { on = [
    "<Space>",
    "w",
  ], run = "plugin keyjump --sync", desc = "Keyjump (Normal mode)" },
  { on = [
    "<Space>",
    "s",
  ], run = "plugin keyjump --sync --args=select", desc = "Keyjump (Select mode)" },
  { on = [
    "<Space>",
    "g",
  ], run = "plugin keyjump --sync --args=global", desc = "Keyjump (Global mode)" },


  # # Find file by its contents and either open the location in yazi or open the file with nvim
  # # This option uses ripgrep to output all the lines of all files, and then uses fzf to fuzzy matching.
  # # The following option passes the input to ripgrep for a match search, reusing the rg search each time the input is changed. This is useful for searching in large folders due to increased speed, but it does not support fuzzy matching.
  # [[manager.prepend_keymap]]
  # on = ["f", "G"]
  # run = "plugin fg --args='rg'"
  # desc = "find file by content (ripgrep match)"
  # [[manager.prepend_keymap]]
  # on = ["f", "f"]
  # run = "plugin fg --args='fzf'"
  # desc = "find file by filename"
  { on = [
    "<Space>",
    "f",
  ], run = "plugin fg", desc = "Keyjump (Global mode)" },

  #
  # Assume the user's ratio is [A,B,C], that is, parent = A , current = B ,preview = C:
  # min-parent: Toggles between  0 and A - the parent is either completely hidden or showed with width A.
  # max-parent: Toggles between A and ∞ - the parent is either showed with width A or fills the entire screen.
  # min-current: Toggles between 0 and B - the current is either completely hidden or showed with width B.
  # max-current: Toggles between B and ∞ - the current is either showed with width B or fills the entire screen.
  # min-preview: Toggles between 0 and C - the preview is either completely hidden or showed with width C.
  # max-preview: Toggles between C and ∞ - the preview is either showed with width C or fills the entire screen.
  # reset: Resets to the user's configured ratio.
  { on = [
    "t",
    "v",
  ], run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
  { on = [
    "t",
    "V",
  ], run = "plugin toggle-pane min-preview", desc = "Minimize or restore the preview pane" },
  { on = [
    "t",
    "c",
  ], run = "plugin toggle-pane max-current", desc = "Maximize or restore the current pane" },
  { on = [
    "t",
    "C",
  ], run = "plugin toggle-pane min-current", desc = "Minimize or restore the current pane" },
  { on = [
    "t",
    "p",
  ], run = "plugin toggle-pane max-parent", desc = "Maximize or restore the parent pane" },
  { on = [
    "t",
    "P",
  ], run = "plugin toggle-pane min-parent", desc = "Minimize or restore the parent pane" },
  { on = [
    "t",
    "r",
  ], run = "plugin toggle-pane restore", desc = "Reset previews" },

  #
  # Key binding	Alternate key	Action
  # q	-	Quit the plugin
  # k	↑	Move up
  # j	↓	Move down
  # l	→	Enter the mount point
  # m	-	Mount the partition
  # u	-	Unmount the partition
  # e	-	Eject the disk
  { on = "m", run = "plugin mount", desc = "Mount and unmount drives" },

  # zip files
  # Supported file types
  # Extention	Unix Command	Windows Command
  # .zip	zip -r	7z a -tzip
  # .7z	7z a	7z a
  # .tar	tar rpf	tar rpf
  # .tar.gz	gzip	7z a -tgzip
  # .tar.xz	xz	7z a -txz
  # .tar.bz2	bzip2	7z a -tbzip2
  # .tar.zst	zstd	zstd
  { on = [
    "c",
    "a",
  ], run = "plugin compress", desc = "Copress all selected files and dirs (.zip, .7z, .tar)" },

  { on = [
    "l",
    "g",
  ], run = "plugin lazygit", desc = "Run Lazygit if in git directory" },

  # copy file contents from yazi
  { on = "<C-C>", run = "plugin copy-file-contents", desc = "Copy contents of file" },


  { on = "<C-c>", run = [
    "plugin wl-clipboard",
  ], desc = "copy file, folder only in wl-clipboard" },

  # or use "d + u" like me
  { on = [
    "d",
    "u",
  ], run = "plugin restore", desc = "Restore last deleted files/folders" },

  { on = [
    "<Space>",
    "s",
  ], run = "plugin what-size", desc = "Calc size of selection or the directory you are in" },
  # ... Other keymaps
  { on = [
    "<Space>",
    "t",
  ], run = "plugin lsd-preview", desc = "Toggle tree/list directory preview" },
  { on = [
    "<Space>",
    "z",
  ], run = "plugin custom-shell -- custom fish 'yazi_zoxide'", desc = "Enter the child directory, or open the file" },
  { on = [
    "'",
    ";",
  ], run = 'plugin custom-shell -- fish --interactive"', desc = "custom-shell as default" },
  # { on = [
  #   "<Space>",
  #   "z",
  # ], run = 'plugin custom-shell --args="custom fish yazi_hidden"', desc = "Enter the child directory, or open the file" },
  # ], run = 'plugin custom-shell -- custom fish "yazi_zoxide"', desc = "Enter the child directory, or open the file" },
  # { on = [
  #   "<Space>",
  #   "d",
  # ], run = 'plugin custom-shell --args="custom fish yazi_directory"', desc = "Enter the child directory, or open the file" },
  # { on = [
  #   "<Space>",
  #   "h",
  # ], run = 'plugin custom-shell --args="custom fish yazi_directory_hidden"', desc = "Enter the child directory, or open the file" },
  # # you can also make custom commads
  # # TODO: find a way to fix the toggle hidden
  # { on = [
  #   "'",
  #   "z",
  # ], run = 'plugin custom-shell --args="custom fish toggle_fzf_hidden"', desc = "fzf show hidden files" },
  # { on = [
  #   "'",
  #   "h",
  # ], run = 'plugin custom-shell --args=history', desc = "Show Custom-shell history" },
  # # { on = ["'","h",], run = 'plugin custom-shell --args="custom fish ls --wait"', desc = "fzf show hidden files" },
  # { on = [
  #   "c",
  #   "m",
  # ], run = "plugin chmod", desc = "chmod a file or dir" },
  # { on = [
  #   "<Space>",
  #   "Z",
  # ], run = 'plugin fzf --hidden', desc = "Enter the child directory, or open the file" },

] # preppend = before the defaults
# append = after the defaults
append_keymap = []

keymap = [
  # Goto
  { on = [
    "g",
    "h",
  ], run = "cd ~", desc = "Go home" },
  { on = [
    "g",
    "c",
  ], run = "cd ~/.config", desc = "Goto ~/.config" },
  { on = [
    "g",
    "C",
  ], run = "cd ~/.cache", desc = "Goto ~/.cache" },
  { on = [
    "g",
    "a",
  ], run = "cd ~/Arch-Hyprland-Personalized", desc = "Goto ~/Arch-Hyprland-Personalized" },
  { on = [
    "g",
    "n",
  ], run = "cd ~/neovim", desc = "Goto ~/neovim" },
  { on = [
    "g",
    "d",
  ], run = "cd ~/Downloads", desc = "Goto ~/Downloads" },
  { on = [
    "g",
    "P",
  ], run = "cd ~/Pictures", desc = "Goto ~/Pictures" },
  { on = [
    "g",
    "m",
  ], run = "cd ~/Music/", desc = "Goto ~/Music" },
  { on = [
    "g",
    "D",
  ], run = "cd ~/Desktop", desc = "Goto ~/Desktop" },
  { on = [
    "g",
    "o",
  ], run = "cd ~/obsidian", desc = "Goto ~/obsidian" },
  { on = [
    "g",
    "g",
  ], run = "cd ~/Games", desc = "Goto ~/Games" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/programming", desc = "Goto ~/programming" },
  { on = [
    "g",
    "w",
  ], run = "cd ~/programming/web_dev", desc = "Goto ~/programming/web_dev" },
  { on = [
    "g",
    "W",
  ], run = "cd ~/programming/Work", desc = "Goto ~/programming/Work" },
  { on = [
    "g",
    "r",
  ], run = "cd ~/programming/Raylib-Game-Dev", desc = "Goto ~/programming/Raylib-Game-Dev" },
  { on = [
    "g",
    "e",
  ], run = "cd ~/programming/ekpa/", desc = "Goto ~/programming/ekpa" },
  { on = [
    "g",
    "C",
  ], run = "cd ~/programming/C++_Code", desc = "Goto ~/programming/C++_Code" },
  { on = [
    "g",
    "<Space>",
  ], run = "cd --interactive", desc = "Jump interactively" },

  { on = "<Esc>", run = "escape", desc = "Exit visual mode, clear selected, or cancel search" },
  { on = "<C-[>", run = "escape", desc = "Exit visual mode, clear selected, or cancel search" },
  { on = "q", run = "quit", desc = "Quit the process" },
  { on = "Q", run = "quit --no-cwd-file", desc = "Quit the process without outputting cwd-file" },
  { on = "<C-q>", run = "close", desc = "Close the current tab, or quit if it's last" },
  { on = "<C-s>", run = "suspend", desc = "Suspend the process" },

  # # Hopping
  # { on = "k", run = "arrow -1", desc = "Move cursor up" },
  # { on = "j", run = "arrow 1", desc = "Move cursor down" },

  { on = "<Up>", run = "arrow -1", desc = "Move cursor up" },
  { on = "<Down>", run = "arrow 1", desc = "Move cursor down" },

  # { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up half page" },
  # { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down half page" },
  # { on = "<C-b>", run = "arrow -100%", desc = "Move cursor up one page" },
  # { on = "<C-f>", run = "arrow 100%", desc = "Move cursor down one page" },

  { on = "<S-PageUp>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<S-PageDown>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "<PageUp>", run = "arrow -100%", desc = "Move cursor up one page" },
  { on = "<PageDown>", run = "arrow 100%", desc = "Move cursor down one page" },

  { on = [
    "g",
    "g",
  ], run = "arrow top", desc = "Move cursor to the top" },
  { on = "G", run = "arrow bot", desc = "Move cursor to the bottom" },

  # # Navigation
  # { on = "h", run = "leave", desc = "Go back to the parent directory" },
  # { on = "l", run = "enter", desc = "Enter the child directory" },

  { on = "<Left>", run = "leave", desc = "Go back to the parent directory" },
  { on = "<Right>", run = "plugin smart-enter", desc = "Enter the child directory" },

  # { on = "H", run = "back", desc = "Go back to the previous directory" },
  # { on = "L", run = "forward", desc = "Go forward to the next directory" },

  # Toggle
  { on = [
    "<Space>",
    "<Space>",
  ], run = [
    "toggle",
    "arrow 1",
  ], desc = "Toggle the current selection state" },
  { on = "<C-a>", run = "toggle_all --state=on", desc = "Select all files" },
  { on = "A", run = "toggle_all", desc = "Invert selection of all files" },

  # Visual mode
  { on = "h", run = "visual_mode", desc = "Enter visual mode (selection mode)" },
  { on = "H", run = "visual_mode --unset", desc = "Enter visual mode (unset mode)" },

  # # Seeking
  # { on = "K", run = "seek -5", desc = "Seek up 5 units in the preview" },
  # { on = "J", run = "seek 5", desc = "Seek down 5 units in the preview" },

  { on = "<S-Up>", run = "seek -5", desc = "Seek up 5 units in the preview" },
  { on = "<S-Down>", run = "seek 5", desc = "Seek down 5 units in the preview" },
  # Spotting
  { on = "<C-h>", run = "spot", desc = "Spot hovered file" },

  # Operation
  # { on = "o", run = "open", desc = "Open selected files" },
  # { on = "O", run = "open --interactive", desc = "Open selected files interactively" },
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
  { on = "<C-Enter>", run = "open", desc = "Open selected files or dir" },
  { on = "<S-Enter>", run = "open --interactive", desc = "Open selected files interactively" },
  # { on = "y", run = "yank", desc = "Yank selected files (copy)" },
  { on = "y", run = [
    '''
  	shell 'for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list'
  ''',
    "yank",
  ], desc = "Yank selected files (copy) in the wl-clipboard aswell" },
  { on = "x", run = "yank --cut", desc = "Yank selected files (cut)" },
  { on = "p", run = "plugin smart-paste", desc = "Paste into the hovered directory or CWD" },
  { on = "<C-p>", run = "paste", desc = "Paste yanked files" },
  { on = "P", run = "paste --force", desc = "Paste yanked files (overwrite if the destination exists)" },
  { on = "-", run = "link", desc = "Symlink the absolute path of yanked files" },
  { on = "_", run = "link --relative", desc = "Symlink the relative path of yanked files" },
  { on = "<C-->", run = "hardlink", desc = "Hardlink yanked files" },
  { on = "Y", run = "unyank", desc = "Cancel the yank status" },
  { on = "X", run = "unyank", desc = "Cancel the yank status" },
  { on = [
    "d",
    "d",
  ], run = "remove", desc = "Trash selected files" },
  { on = [
    "d",
    "D",
  ], run = "remove --permanently", desc = "Permanently delete selected files" },
  { on = "a", run = "create", desc = "Create a file (ends with / for directories)" },
  { on = "r", run = "rename --cursor=before_ext", desc = "Rename selected file(s)" },
  { on = ";", run = "shell --interactive", desc = "Run a shell command" },
  { on = ":", run = "shell --block --interactive", desc = "Run a shell command (block until finishes)" },
  { on = ".", run = "hidden toggle", desc = "Toggle the visibility of hidden files" },
  { on = "s", run = "search --via=fd", desc = "Search files by name via fd" },
  { on = "S", run = "search --via=rg", desc = "Search files by content via ripgrep" },
  { on = "<Esc>", run = "escape --search", desc = "Cancel the ongoing search" },
  { on = "z", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
  # { on = "Z", run = "plugin fzf", desc = "Jump to a file/directory via fzf" },
  { on = "Z", run = "plugin fzf --layout=reverse --height=40% ", desc = "fzf search" },
  # capital Z uses fzf in a floating pane 

  # Linemode
  { on = [
    "l",
    "s",
  ], run = "linemode size", desc = "Linemode: size" },
  { on = [
    "l",
    "p",
  ], run = "linemode permissions", desc = "Linemode: permissions" },
  { on = [
    "l",
    "b",
  ], run = "linemode btime", desc = "Linemode: btime" },
  { on = [
    "l",
    "m",
  ], run = "linemode mtime", desc = "Linemode: mtime" },
  { on = [
    "l",
    "o",
  ], run = "linemode owner", desc = "Linemode: owner" },
  { on = [
    "l",
    "n",
  ], run = "linemode none", desc = "Linemode: none" },
  { on = [
    "l",
    "c",
  ], run = "linemode size_mtime_btime", desc = "Linemode: custom" },

  # Copy
  { on = [
    "c",
    "c",
  ], run = "copy path", desc = "Copy the file path" },
  { on = [
    "c",
    "d",
  ], run = "copy dirname", desc = "Copy the directory path" },
  { on = [
    "c",
    "f",
  ], run = "copy filename", desc = "Copy the filename" },
  { on = [
    "c",
    "n",
  ], run = "copy name_without_ext", desc = "Copy the filename without extension" },

  # Filter
  { on = "f", run = "plugin smart-filter", desc = "keep on filtering and going in to the matching files, directorys" },
  { on = "F", run = "filter --smart", desc = "Filter files" },

  # Find
  { on = "/", run = "find --smart", desc = "Find next file" },
  { on = "<C-/>", run = "find --previous --smart", desc = "Find previous file" },
  { on = "n", run = "find_arrow", desc = "Goto the next found" },
  { on = "N", run = "find_arrow --previous", desc = "Goto the previous found" },

  # Sorting
  { on = [
    ",",
    "m",
  ], run = [
    "sort mtime --reverse=no",
    "linemode mtime",
  ], desc = "Sort by modified time" },
  { on = [
    ",",
    "M",
  ], run = [
    "sort mtime --reverse",
    "linemode mtime",
  ], desc = "Sort by modified time (reverse)" },
  { on = [
    ",",
    "b",
  ], run = [
    "sort btime --reverse=no",
    "linemode btime",
  ], desc = "Sort by birth time" },
  { on = [
    ",",
    "B",
  ], run = [
    "sort btime --reverse",
    "linemode btime",
  ], desc = "Sort by birth time (reverse)" },
  { on = [
    ",",
    "e",
  ], run = "sort extension --reverse=no", desc = "Sort by extension" },
  { on = [
    ",",
    "E",
  ], run = "sort extension --reverse", desc = "Sort by extension (reverse)" },
  { on = [
    ",",
    "a",
  ], run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
  { on = [
    ",",
    "A",
  ], run = "sort alphabetical --reverse", desc = "Sort alphabetically (reverse)" },
  { on = [
    ",",
    "n",
  ], run = "sort natural --reverse=no", desc = "Sort naturally" },
  { on = [
    ",",
    "N",
  ], run = "sort natural --reverse", desc = "Sort naturally (reverse)" },
  { on = [
    ",",
    "s",
  ], run = [
    "sort size --reverse=no",
    "linemode size",
  ], desc = "Sort by size" },
  { on = [
    ",",
    "S",
  ], run = [
    "sort size --reverse",
    "linemode size",
  ], desc = "Sort by size (reverse)" },
  { on = [
    ",",
    "r",
  ], run = "sort random --reverse=no", desc = "Sort randomly" },

  # Tabs
  { on = "<C-Tab>", run = "plugin smart-tab", desc = "Create a tab and enter the hovered directory" },
  { on = [
    "<Space>",
    "<Tab>",
  ], run = "tab_create ", desc = "Create a new tab from home directory" },

  { on = "1", run = "tab_switch 0", desc = "Switch to the first tab" },
  { on = "2", run = "tab_switch 1", desc = "Switch to the second tab" },
  { on = "3", run = "tab_switch 2", desc = "Switch to the third tab" },
  { on = "4", run = "tab_switch 3", desc = "Switch to the fourth tab" },
  { on = "5", run = "tab_switch 4", desc = "Switch to the fifth tab" },
  { on = "6", run = "tab_switch 5", desc = "Switch to the sixth tab" },
  { on = "7", run = "tab_switch 6", desc = "Switch to the seventh tab" },
  { on = "8", run = "tab_switch 7", desc = "Switch to the eighth tab" },
  { on = "9", run = "tab_switch 8", desc = "Switch to the ninth tab" },

  { on = "<Tab>", run = "tab_switch -1 --relative", desc = "Switch to the previous tab" },
  { on = "<BackTab>", run = "tab_switch 1 --relative", desc = "Switch to the next tab" },

  { on = "{", run = "tab_swap -1", desc = "Swap current tab with previous tab" },
  { on = "}", run = "tab_swap 1", desc = "Swap current tab with next tab" },

  # Tasks
  { on = "T", run = "tasks_show", desc = "Show task manager" },

  # Help
  { on = "?", run = "help", desc = "Open help" },
  { on = "<F1>", run = "help", desc = "Open help" },
]

[tasks]

