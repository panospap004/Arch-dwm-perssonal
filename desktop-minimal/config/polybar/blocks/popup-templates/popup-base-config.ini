; Base popup bar template
[bar/popup_base]
background = ${color.background}
foreground = ${color.foreground}
width = 500
height = 34
monitor = ${env:MONITOR:}
offset-x = 25%
offset-y = 34px 
; you can also use % for y
fixed-center = true
; bottom = true
top = true
override-redirect = true
enable-ipc = true

; Visual styling matching your main bar
border-top-size = 2
border-top-color = ${color.primary}
line-size = 5
line-color = ${color.background}

; Spacing
padding = 0
module-margin-left = 0
module-margin-right = 0

; Fonts (matching your main bar)
font-0 = "MonaspaceRadonNF:size=10;3"
font-1 = "feather:size=10;3"
font-2 = "Iosevka Nerd Font:size=10;3"
font-3 = "Noto Sans CJK JP:size=10;3"
