# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[╰─• ](bold fg:cat_teal) "
error_symbol = "[╰─• 󰅙](bold fg:red_light) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

[git_branch]
symbol = "󰘬"
truncation_length = 4
truncation_symbol = ""
format = "[─](bold fg:cat_teal)[](bold fg:cat_sapphire6)[$symbol](fg:cat_primary bg:cat_sapphire6)[](bold fg:cat_sapphire6 bg:cat_surface1)[ $branch(:$remote_branch)](bold fg:cat_sapphire6 bg:cat_surface1)"

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "fg:git_status bg:cat_sapphire6"
deleted_style = "fg:deep_red bg:cat_sapphire6"
format = "[](bold fg:cat_surface1 bg:cat_sapphire6)[  $added]($added_style)[/](fg:cat_primary bg:cat_sapphire6)[  $deleted]($deleted_style)"

[git_status]
ahead = ' ${count} '
# cyan
behind = ' ${count} '
# crimson
conflicted = ' ${count} '
# red
deleted = ' ${count} '
# gray
diverged = '  ${ahead_count} /  ${behind_count} '
# purple
modified = ' ${count} '
# orange
renamed = '󰙏 ${count} '
# teal
staged = '󰏕 ${count} '
# green
stashed = ' ${count} '
# yellow
untracked = '󰈉 ${count} '
# gray
format = "[](bold fg:cat_sapphire6 bg:cat_sapphire4)[ $ahead](fg:cyan1 bg:cat_sapphire4)[$behind](fg:deep_crimson bg:cat_sapphire4)[$diverged](fg:directory bg:cat_sapphire4)[$conflicted](fg:deep_red bg:cat_sapphire4)[$deleted](fg:cat_overlay0 bg:cat_sapphire4)[$modified](fg:duration bg:cat_sapphire4)[$renamed](fg:cat_sky bg:cat_sapphire4)[$staged](fg:cat_sapphire3 bg:cat_sapphire4)[$stashed](fg:yellow1 bg:cat_sapphire4)[$untracked](fg:cat_surface1 bg:cat_sapphire4)[](bold fg:cat_sapphire4)[  ](bold fg:cat_teal)"

[time]
disabled = false
time_format = "%R"
style = "cat_blue9"
format = """
[• ](bold fg:cat_teal)\
[](fg:cat_surface1)[$time ](bold fg:$style bg:cat_surface1)\
[](fg:$style bg:cat_surface1)[ ](bold fg:cat_primary bg:$style)[](fg:$style)\
"""

[username]
style_root = "crimson bold"
format = "[• ](bold fg:cat_teal)[](bold fg:cat_surface1)[$user ](bold fg:cat_blue3 bg:cat_surface1)[](bold fg:cat_blue3 bg:cat_surface1)[ 󰇥 ]( fg:yellow2 bg:cat_blue3)[](bold fg:cat_blue3)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = " 󰏮 "
truncation_length = 3
truncation_symbol = "••/"
format = '[](fg:cat_sapphire7)[ ](bold fg:cat_primary bg:cat_sapphire7)[](fg:cat_sapphire7 bg:cat_surface1)[ $read_only$truncation_symbol$path](bold fg:cat_sapphire7 bg:cat_surface1)[](fg:cat_surface1)[─](bold fg:cat_teal)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "

[cmd_duration]
min_time = 0
format = '[╭─•](bold fg:cat_teal)[](bold fg:cat_sapphire9)[󱐋](fg:cat_primary bg:cat_sapphire9)[](bold fg:cat_sapphire9 bg:cat_surface1)[ $duration](bold fg:cat_sapphire9 bg:cat_surface1)[](bold fg:cat_surface1)[ ••](bold fg:cat_teal)'

[fill]
symbol = '─'
style = 'fg:cat_teal '

[shell]
format = '[  ](bold fg:cat_teal)[](fg:cat_surface1)[$indicator ](bold fg:cat_sapphire bg:cat_surface1)[](fg:cat_sapphire bg:cat_surface1)[ ](fg:cat_primary bg:cat_sapphire)[](fg:cat_sapphire)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

