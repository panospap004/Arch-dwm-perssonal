# Background image settings
background_image /home/pappanos/Pictures/term_back.png
background_image_layout scaled
background_tint 0.7

# Padding around text
window_padding_width 16

# Remaps

# Swap copy and paste shortcuts
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Remap original ctrl+c (interrupt) and ctrl+v (literal insert)
map ctrl+shift+c send_text all \x03
map ctrl+shift+v send_text all \x16


# Switching between tabs
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Unmap default shortcut ctrl+shift
map ctrl+tab no_op
map ctrl+shift+left  noop
map ctrl+shift+right noop

# Default layout
enabled_layouts grid

# Open new tab
map ctrl+shift+w new_tab

# Open new window (split )
map ctrl+shift+s new_window

# Close current window or split
map ctrl+shift+q close_window

# Switching to next tab
map ctrl+alt+right next_window

# Switching to previous tab
map ctrl+alt+left previous_window

cursor_trail 2
cursor_trail_decay 0.2 0.5
