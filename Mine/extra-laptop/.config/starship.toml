# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[╰─• ](bold fg:blue) "
error_symbol = "[╰─• 󰅙](bold fg:red_light) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

[git_branch]
symbol = "󰘬"
truncation_length = 4
truncation_symbol = ""
format = "[─](bold fg:blue)[](bold fg:green6)[$symbol](fg:gray1 bg:green6)[](bold fg:green6 bg:gray_dark)[ $branch(:$remote_branch)](bold fg:green6 bg:gray_dark)"

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "fg:git_status1 bg:green6"
deleted_style = "fg:red bg:green6"
format = "[](bold fg:gray_dark bg:green6)[  $added]($added_style)[/](fg:gray1 bg:green6)[  $deleted]($deleted_style)"

[git_status]
ahead = ' ${count} '
# cyan
behind = ' ${count} '
# crimson
conflicted = ' ${count} '
# red
deleted = ' ${count} '
# gray
diverged = '  ${ahead_count} /  ${behind_count} '
# purple
modified = ' ${count} '
# orange
renamed = '󰙏 ${count} '
# teal
staged = '󰏕 ${count} '
# green
stashed = ' ${count} '
# yellow
untracked = '󰈉 ${count} '
# gray
format = "[](bold fg:green6 bg:green7)[ $ahead](fg:cyan1 bg:green7)[$behind](fg:deep_crimson bg:green7)[$diverged](fg:purple bg:green7)[$conflicted](fg:deep_red bg:green7)[$deleted](fg:black_gray bg:green7)[$modified](fg:yellow2 bg:green7)[$renamed](fg:blue_light bg:green7)[$staged](fg:green66 bg:green7)[$stashed](fg:yellow1 bg:green7)[$untracked](fg:gray_dark bg:green7)[](bold fg:green7)[  ](bold fg:blue)"

[time]
disabled = false
time_format = "%R"
style = "red"
format = """
[• ](bold fg:blue)\
[](fg:gray_dark)[$time ](bold fg:$style bg:gray_dark)\
[](fg:$style bg:gray_dark)[ ](bold fg:gray1 bg:$style)[](fg:$style)\
"""

[username]
style_root = "crimson bold"
format = "[• ](bold fg:blue)[](bold fg:gray_dark)[$user ](bold fg:orange bg:gray_dark)[](bold fg:orange bg:gray_dark)[ 󰇥 ]( fg:yellow3 bg:orange)[](bold fg:orange)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = " 󰏮 "
truncation_length = 3
truncation_symbol = "••/"
format = '[](fg:green)[ ](bold fg:gray1 bg:green)[](fg:green bg:gray_dark)[ $read_only$truncation_symbol$path](bold fg:green bg:gray_dark)[](fg:gray_dark)[─](bold fg:blue)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "

[cmd_duration]
min_time = 0
format = '[╭─•](bold fg:blue)[](bold fg:cyan)[󱐋](fg:gray1 bg:cyan)[](bold fg:cyan bg:gray_dark)[ $duration](bold fg:cyan bg:gray_dark)[](bold fg:gray_dark)[ ••](bold fg:blue)'

[fill]
symbol = '─'
style = 'fg:blue '

[shell]
format = '[  ](bold fg:blue)[](fg:gray_dark)[$indicator ](bold fg:yellow bg:gray_dark)[](fg:yellow bg:gray_dark)[ ](fg:gray1 bg:yellow)[](fg:yellow)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

