[bar/popup_tray]
monitor = ${env:MONITOR:}
inherit = bar/popup_base
width = 400
offset-x = 35%
; offset-y = 34px is inherited from popup_base

; Enable system tray for this popup
tray-position = center
tray-detached = false
tray-maxsize = 22
tray-background = ${color.background}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 4
tray-scale = 1.0

; Must have at least one module even if empty
modules-center = tray-spacer

[module/tray-spacer]
monitor = ${env:MONITOR:}
type = custom/text
content = "⏽"
content-background = ${color.background}
content-padding = 0
