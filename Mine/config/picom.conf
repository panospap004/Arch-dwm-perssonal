# ~/.config/picom.conf

###################################
#             Backend             #
###################################
# xrender , glx, egl, or xr_glx_hybrid
backend = "glx"
vsync = true

# Use higher precision during rendering, and apply dither when presenting the
# rendered screen. Reduces banding artifacts, but may cause performance
# degradation. Only works with OpenGL.
dithered-present = false;

# Make transparent windows clip other windows like non-transparent windows do,
# instead of blending on top of them. e.g. placing a transparent window on top
# of another window will cut a "hole" in that window, and show the desktop background
# underneath.
#
# Default: false
transparent-clipping = false

###################################
#             Fading              #
###################################
fading=true
fade-in-step = 0.07
fade-out-step = 0.07
fade-delta = 13
# Do not fade on window open/close.
# no-fading-openclose = false

###################################
#             Opacity             #
###################################
inactive-opacity = 0.85;
active-opacity = 1;
inactive-opacity-override = false
# In your picom.conf file
opacity-rule = [ "100:fullscreen" ]
#################################
#           Corners             #
#################################

# Sets the radius of rounded window corners. When > 0, the compositor will
# round the corners of windows. Does not interact well with
# `transparent-clipping`.
#
# Default: 0 (disabled)
corner-radius = 0

#################################
#            Blur               #
#################################

# Parameters for background blurring, see BLUR section in the man page for more information.
# methods = {none, gaussian, box, kernel (define custom for kernel), dual_kawase}
blur-method = "dual_kawase";
# blur-size = 10 # this is for box and gaussian
#
# blur-deviation = false
#
blur-strength = 6

# Blur background of semi-transparent / ARGB windows.
# Can be set per-window using rules.
#
# Default: false
blur-background = true

# Blur background of windows when the window frame is not opaque.
# Implies:
#    blur-background
#
# Default: false
# blur-background-frame = true

# Use fixed blur strength rather than adjusting according to window opacity.
#
# Default: false
blur-background-fixed = true

###################################
#             Animation           #
###################################
animations = (
  {
    triggers = ["open"];
    preset = "appear";
    scale = 0.7;
    duration = 0.15;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    scale = 0.7;
    duration = 0.15;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.2;
  }
)

###################################
#             General             #
###################################
mark-wmwin-focused = true
mark-ovredir-focused = true
detect-client-opacity = true

# Rule-based per-window options.
#
# wintypes are the following 
#
# unknown, desktop, dock, toolbar, menu, utility, splash, dialog, normal, dropdown_menu, popup_menu, tooltip, notification, combo, dnd
#
# its one has the following options 
#
# fade, shadow = controls window type specific shadow gade settings
# opacity = its opacity 
# focus = considers if its always on focus or not 
# blur-background = if it has a background blur 
# full-shadow = if it has a shadow under it 
# clip-shadow-above = above shadow 
# redir-ignore = if the window of this screen should be redirected again
#
# simple way to find witch one you are looking for just set the opacity of each one at a time at 0.1 if tis brearly visible its that option
wintypes:
{

# menu is the right click in browsers 
  menu = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; opacity = 1.0; blur-background = false; animations = false;}
  notification = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; opacity = 1.0; blur-background = false; animations = false;}
  utility = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; opacity = 1.0; blur-background = false; animations = false;}
  popup_menu = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; opacity = 1.0; blur-background = false; animations = false;}

 # this is polybar # dock = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; opacity = 1.0; blur-background = false;}

}

