# MPD Configuration File
# Save this as ~/.config/mpd/mpd.conf

# Required paths
music_directory    "/home/dwm-test/Music"
playlist_directory "/home/dwm-test/.config/mpd/playlists"
db_file            "/home/dwm-test/.config/mpd/database"
log_file           "/home/dwm-test/.config/mpd/mpd.log"
pid_file           "/home/dwm-test/.config/mpd/pid"
state_file         "/home/dwm-test/.config/mpd/state"
sticker_file       "/home/dwm-test/.config/mpd/sticker.sql"

# Network settings
bind_to_address    "localhost"
port               "6600"

# Audio output configuration
audio_output {
    type           "pipewire"
    name           "PipeWire Output"
}

# Alternative audio output (uncomment if pipewire doesn't work)
#audio_output {
#    type           "pulse"
#    name           "PulseAudio Output"
#}

# Alternative audio output (fallback to ALSA)
#audio_output {
#    type           "alsa"
#    name           "ALSA Output"
#}

# Input settings
input {
    plugin "curl"
}

# Decoder settings (optional - removes wildmidi warning)
decoder {
    plugin                   "wildmidi"
    enabled                  "no"
}

# Auto update database
auto_update                  "yes"

# Follow outside changes
auto_update_depth           "3"

# Permissions
#password                   "password@read,add,control,admin"

# Other settings
filesystem_charset          "UTF-8"

# Enable MPRIS support
audio_output {
    type    "fifo"
    name    "my_fifo"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
